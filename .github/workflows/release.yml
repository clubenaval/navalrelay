name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/clubenaval/navalrelay
          tags: |
            ghcr.io/clubenaval/navalrelay-app:${{ steps.v.outputs.version }}
            ghcr.io/clubenaval/navalrelay-app:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./mta
          push: true
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.source=https://github.com/clubenaval/navalrelay
          tags: |
            ghcr.io/clubenaval/navalrelay-mta:${{ steps.v.outputs.version }}
            ghcr.io/clubenaval/navalrelay-mta:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/clubenaval/navalrelay
          tags: |
            ghcr.io/clubenaval/navalrelay-cli:${{ steps.v.outputs.version }}
            ghcr.io/clubenaval/navalrelay-cli:latest
