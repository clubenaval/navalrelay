# NavalRelay CLI, modo RELAY: entrega direto aos servidores de destino (MX) e assina com DKIM.
# Relay SMTP leve (Exim), sem painel e sem banco de dados.
# Para entregar por outro servidor SMTP (Gmail, Office 365...), use docker-compose.cli-smarthost.yml.
# Toda a configuração fica neste arquivo. Para mudar algo: edite e rode
#   docker compose -f docker-compose.cli-relay.yml up -d
#
# Guia rápido
#   1. Preencha ORBITA_HOSTNAME e ORBITA_DOMAINS (e as redes autorizadas).
#   2. Suba:            docker compose -f docker-compose.cli-relay.yml up -d
#   3. Veja o DNS:      docker exec navalrelay-cli orbita dns
#   4. Publique SPF, DKIM e DMARC no DNS de cada domínio (veja "DNS" abaixo).
#   5. Teste:           docker exec navalrelay-cli orbita test-mail voce@gmail.com
#   6. Acompanhe:       docker logs -f navalrelay-cli
#
# Comandos úteis (docker exec navalrelay-cli orbita ...)
#   status      SMTP, fila, chaves DKIM e conexão com o servidor central
#   dns         registros SPF, DKIM e DMARC prontos para publicar
#   config      configuração efetiva (config --exim mostra o exim.conf, sem senhas)
#   queue       fila de mensagens
#   test-mail   test-mail destino@exemplo.com [remetente]
#
# Valores inválidos fazem o contêiner parar na subida, com a mensagem do erro em "docker logs".

name: navalrelay-cli

services:
  navalrelay-cli:
    image: ghcr.io/clubenaval/navalrelay-cli:0.0.4
    container_name: navalrelay-cli
    hostname: relay-filial
    restart: unless-stopped

    # Portas SMTP publicadas. Quem envia deve usar o IP da máquina (ou o nome DNS dela),
    # nunca localhost/127.0.0.1: pelo localhost o Docker mascara a origem e o relay recusa
    # a conexão de propósito (550 Connection through Docker gateway refused).
    ports:
      - "25:25"
      - "587:587"

    environment:
      TZ: America/Sao_Paulo

      # ---------------------------------------------------------------- Básico
      # Modo de entrega: este arquivo é o modo relay (entrega direta e DKIM próprio).
      ORBITA_MODE: relay

      # OBRIGATÓRIA. Nome DNS do relay: vai no EHLO e no certificado TLS.
      # Precisa de registro A apontando para o IP público de saída e, de preferência,
      # PTR (DNS reverso) apontando de volta para este nome.
      ORBITA_HOSTNAME: relay.exemplo.com.br

      # dual (IPv4 + IPv6, padrão) ou ipv4 (só IPv4).
      # ORBITA_IP_MODE: dual

      # Tamanho máximo da mensagem, em MB (padrão 25).
      # ORBITA_MAX_MESSAGE_MB: 25

      # ------------------------------------------------- Quem pode enviar (redes)
      # IPs ou redes CIDR autorizados a enviar, separados por vírgula.
      # Padrão: 10.0.0.0/8,192.168.0.0/16,fd00::/8
      # Cuidado: tudo o que estiver aqui pode mandar e-mail por este relay.
      ORBITA_RELAY_NETS: 10.0.0.0/8,192.168.0.0/16

      # true (padrão): soma o loopback e a rede Docker do próprio contêiner à lista acima.
      # ORBITA_RELAY_NETS_AUTO: "true"

      # IPs da máquina hospedeira a autorizar também (opcional).
      # ORBITA_HOST_IPS: 192.168.0.10

      # ---------------------------------------------------- Domínios e DKIM (relay)
      # Domínios de envio, separados por vírgula. Para cada um o contêiner:
      #   - gera sozinho uma chave DKIM (RSA 2048) na primeira subida, em /data/dkim;
      #   - assina as mensagens cujo remetente (From) seja desse domínio;
      #   - só aceita remetentes desses domínios (veja ORBITA_ENFORCE_SENDER_DOMAINS).
      # Sem domínios, nada é assinado e o remetente não é restringido.
      ORBITA_DOMAINS: exemplo.com.br

      # Seletor DKIM (padrão dkim). O registro DNS fica em <seletor>._domainkey.<dominio>.
      # Para trocar a chave de um domínio: apague /data/dkim/<dominio>.key e .pub do volume,
      # recrie o contêiner e atualize o DNS.
      # ORBITA_DKIM_SELECTOR: dkim

      # true (padrão): recusa remetentes fora de ORBITA_DOMAINS (550 Sender domain not allowed).
      # ORBITA_ENFORCE_SENDER_DOMAINS: "true"

      # ------------------------------------------------------------------- DNS
      # O contêiner NÃO altera o DNS: ele mostra os registros prontos
      # (docker exec navalrelay-cli orbita dns). Você publica em cada domínio:
      #   <dominio>                  TXT  SPF   v=spf1 ip4:203.0.113.10 ~all
      #   <seletor>._domainkey.<dom> TXT  DKIM  v=DKIM1; k=rsa; p=...   (valor completo no "orbita dns")
      #   _dmarc.<dominio>           TXT  DMARC v=DMARC1; p=none; adkim=r; aspf=r; pct=100
      # Se o domínio já tem SPF, não crie um segundo: acrescente o ip4:/ip6: ao existente.
      # Comece o DMARC com p=none (só monitora); passe a quarantine/reject depois de
      # confirmar que SPF e DKIM passam.
      # Além disso: PTR (DNS reverso) do IP público e porta 25 de saída liberada na rede.

      # IPs públicos de saída, para montar o SPF (IPv4 e IPv6, separados por vírgula).
      # Sem isso, o SPF usa "a:<ORBITA_HOSTNAME>".
      ORBITA_PUBLIC_IPS: 203.0.113.10

      # Política e e-mail de relatórios do DMARC. Mudam só o texto mostrado: o DMARC em si vive no DNS.
      # ORBITA_DMARC_POLICY: none        # none, quarantine ou reject
      # ORBITA_DMARC_RUA: dmarc@exemplo.com.br

      # ------------------------------------------------- Servidor central (opcional)
      # Envia os eventos do log deste relay ao painel NavalRelay central, que unifica
      # os relatórios. Sem a URL, o relay funciona sozinho.
      # No central: Relays remotos > adicionar servidor > copie o token (aparece uma vez).
      # ORBITA_CENTRAL_URL: https://orbita.exemplo.com.br
      # ORBITA_CENTRAL_TOKEN: orb_...        # obrigatório quando a URL é informada
      # ORBITA_CENTRAL_SKIP_VERIFY: "false"  # true só para certificado autoassinado
      # ORBITA_CENTRAL_INTERVAL: 10          # intervalo de envio, em segundos
      # Se o central ficar fora do ar, o envio retoma de onde parou, sem perda e sem duplicar.

      # ------------------------------------------------------------------ Logs
      # O log do Exim aparece em "docker logs -f navalrelay-cli" (linhas [reject] e
      # [panic] marcadas; [cli] são os eventos do próprio contêiner). Os arquivos ficam
      # em /var/log/exim dentro do contêiner, com rotação:
      # ORBITA_LOG_ROTATE_MB: 50   # roda ao passar deste tamanho (MB)
      # ORBITA_LOG_KEEP: 7         # arquivos antigos mantidos

    volumes:
      # /data guarda as chaves DKIM, o certificado TLS e o cursor de envio ao central.
      # Mantenha este volume: sem ele, as chaves DKIM mudam a cada recriação do contêiner
      # e o DNS publicado deixa de valer (o contêiner avisa no log).
      - cli-data:/data
      # Fila de mensagens ainda não entregues; preserva a fila ao recriar o contêiner.
      - cli-spool:/var/spool/exim4

volumes:
  cli-data:
  cli-spool:
